<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DWM — Admin Events</title>

<link rel="stylesheet" href="/assets/css/shared.css">
<link rel="stylesheet" href="/assets/css/pages.css">

<style>
.events-admin-wrap{
  width:min(1380px,92%);
  margin:120px auto 80px;
}

.events-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:34px;
}

.events-eyebrow{
  color:var(--teal-bright);
  font-size:.65rem;
  letter-spacing:.25em;
  text-transform:uppercase;
  font-weight:800;
}

.events-title{
  font-size:clamp(2.8rem,6vw,5rem);
  margin:7px 0;
  line-height:.95;
}

.events-sub{
  color:var(--gray-light);
}

.admin-btn{
  border:1px solid rgba(255,255,255,.13);
  background:#151515;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  text-decoration:none;
  display:inline-block;
}

.admin-btn.primary{
  background:var(--teal-bright);
  color:#07110f;
  border-color:transparent;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  padding:20px;
  background:#111;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
}

.stat small{
  color:var(--gray-light);
  text-transform:uppercase;
  letter-spacing:.14em;
}

.stat strong{
  display:block;
  font-size:2rem;
  margin-top:8px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 220px auto;
  gap:10px;
  margin-bottom:22px;
}

.control{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:#111;
  color:#fff;
  box-sizing:border-box;
}

.events-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.event-card{
  overflow:hidden;
  background:#111;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
}

.event-image{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#191919;
}

.event-body{
  padding:18px;
}

.event-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.event-title{
  font-size:1.05rem;
  font-weight:800;
}

.event-location{
  color:var(--teal-bright);
  font-size:.68rem;
  margin-top:5px;
}

.event-date{
  margin:15px 0;
  font-size:.82rem;
}

.event-desc{
  color:var(--gray-light);
  font-size:.76rem;
  line-height:1.6;
  min-height:48px;
}

.badge{
  padding:6px 9px;
  border-radius:999px;
  font-size:.58rem;
  text-transform:uppercase;
  font-weight:800;
  height:max-content;
}

.badge-published{
  color:#71e5c4;
  background:rgba(60,210,170,.13);
}

.badge-draft{
  color:#bbb;
  background:rgba(255,255,255,.08);
}

.badge-cancelled{
  color:#ff9696;
  background:rgba(220,70,70,.14);
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.card-actions button{
  flex:1;
}

.danger{
  color:#ff9292;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:#101010;
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:26px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-label{
  display:block;
  font-size:.65rem;
  margin-bottom:7px;
  color:var(--gray-light);
  text-transform:uppercase;
  letter-spacing:.12em;
}

textarea.control{
  min-height:120px;
  resize:vertical;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

#formStatus{
  margin-top:10px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  border:1px dashed rgba(255,255,255,.14);
  border-radius:14px;
  padding:40px;
  color:var(--gray-light);
}

[data-theme="light"] .stat,
[data-theme="light"] .event-card,
[data-theme="light"] .control,
[data-theme="light"] .admin-btn,
[data-theme="light"] .modal{
  background:#fff;
  color:#111;
  border-color:rgba(0,0,0,.1);
}

[data-theme="light"] .event-image{
  background:#f4f4f4;
}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .events-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .events-grid{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .events-head{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<nav></nav>

<main class="events-admin-wrap">

  <div class="events-head">

    <div>
      <div class="events-eyebrow">Administration</div>
      <h1 class="events-title">Events.</h1>
      <p class="events-sub">
        Manage DWM pop-ups, parties, showcases and market events.
      </p>
    </div>

    <div>
      <a href="/admin.html" class="admin-btn">← Admin</a>

      <button id="addEvent" class="admin-btn primary">
        + Add Event
      </button>
    </div>

  </div>

  <section class="stats">

    <div class="stat">
      <small>Total</small>
      <strong id="statTotal">0</strong>
    </div>

    <div class="stat">
      <small>Published</small>
      <strong id="statPublished">0</strong>
    </div>

    <div class="stat">
      <small>Draft</small>
      <strong id="statDraft">0</strong>
    </div>

    <div class="stat">
      <small>Cancelled</small>
      <strong id="statCancelled">0</strong>
    </div>

  </section>

  <section class="filters">

    <input
      id="eventSearch"
      class="control"
      placeholder="Search title, city, venue..."
    >

    <select id="statusFilter" class="control">
      <option value="">All Statuses</option>
      <option value="published">Published</option>
      <option value="draft">Draft</option>
      <option value="cancelled">Cancelled</option>
    </select>

    <button id="refreshEvents" class="admin-btn">
      Refresh
    </button>

  </section>

  <div id="eventsStatus"></div>

  <section id="eventsGrid" class="events-grid"></section>

</main>

<div id="eventModal" class="modal-backdrop">

  <div class="modal">

    <div class="modal-head">
      <h2 id="modalTitle">Add Event</h2>
      <button id="closeModal" class="admin-btn">✕</button>
    </div>

    <form id="eventForm">

      <input id="editingEventId" type="hidden">

      <div class="form-grid">

        <div class="form-group full">
          <label class="form-label">Event Title</label>
          <input id="eventTitle" class="control" required maxlength="120">
        </div>

        <div class="form-group">
          <label class="form-label">City</label>
          <input id="eventCity" class="control" required>
        </div>

        <div class="form-group">
          <label class="form-label">Venue</label>
          <input id="eventVenue" class="control">
        </div>

        <div class="form-group">
          <label class="form-label">Event Type</label>

          <select id="eventType" class="control">
            <option value="Pop-up Market">Pop-up Market</option>
            <option value="Drop Party">Drop Party</option>
            <option value="Brand Showcase">Brand Showcase</option>
            <option value="Block Party">Block Party</option>
            <option value="Online">Online</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Date & Time</label>
          <input
            id="eventDate"
            class="control"
            type="datetime-local"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label">Status</label>

          <select id="eventStatus" class="control">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="form-group full">
          <label class="form-label">Image URL</label>
          <input id="eventImage" class="control" placeholder="https://...">
        </div>

        <div class="form-group full">
          <label class="form-label">Ticket / Info URL</label>
          <input id="eventLink" class="control" placeholder="https://...">
        </div>

        <div class="form-group full">
          <label class="form-label">Description</label>
          <textarea id="eventDescription" class="control" maxlength="2000"></textarea>
        </div>

      </div>

      <div id="formStatus"></div>

      <div class="form-actions">
        <button type="button" id="cancelForm" class="admin-btn">
          Cancel
        </button>

        <button type="submit" id="saveEvent" class="admin-btn primary">
          Save Event
        </button>
      </div>

    </form>

  </div>
</div>

<script type="module" src="/assets/js/admin-events.js"></script>

</body>
</html>
