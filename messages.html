<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>DWM — Messages</title>

  <link
    rel="stylesheet"
    href="/assets/css/shared.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/pages.css"
  >

  <style>

    .messages-shell {
      width:min(1250px,calc(100% - 48px));
      margin:0 auto;
      padding:120px 0 90px;
    }

    .messages-head {
      margin-bottom:30px;
    }

    .messages-head h1 {
      font-family:'Cinzel',serif;
      font-size:clamp(2.7rem,6vw,5rem);
      line-height:.95;
      margin:8px 0 12px;
    }

    .messages-head p {
      color:var(--gray-light);
    }

    .messages-layout {
      min-height:620px;
      display:grid;
      grid-template-columns:340px minmax(0,1fr);
      border:1px solid var(--border);
    }

    .conversation-sidebar {
      border-right:1px solid var(--border);
      min-width:0;
    }

    .conversation-sidebar-head {
      padding:20px;
      border-bottom:1px solid var(--border);
      font-size:.65rem;
      font-weight:700;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .conversation-list {
      max-height:680px;
      overflow-y:auto;
    }

    .conversation-row {
      width:100%;
      display:block;
      text-align:left;
      padding:18px 20px;
      border:0;
      border-bottom:1px solid var(--border);
      background:transparent;
      color:inherit;
      font-family:inherit;
      cursor:pointer;
    }

    .conversation-row:hover,
    .conversation-row.active {
      background:rgba(74,157,168,.06);
    }

    .conversation-row.active {
      box-shadow:inset 3px 0 0 var(--teal-bright);
    }

    .conversation-name {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:700;
    }

    .conversation-preview {
      margin-top:6px;
      color:var(--gray-light);
      font-size:.78rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .conversation-context {
      margin-top:7px;
      color:var(--teal-dim);
      font-size:.6rem;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .message-unread {
      min-width:20px;
      height:20px;
      padding:0 6px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      background:var(--teal-bright);
      color:#071113;
      font-size:10px;
      font-weight:700;
    }

    .chat-panel {
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .chat-head {
      min-height:78px;
      padding:18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      border-bottom:1px solid var(--border);
    }

    .chat-head-title {
      font-family:'Cinzel',serif;
      font-weight:700;
    }

    .chat-head-context {
      margin-top:4px;
      color:var(--gray-light);
      font-size:.72rem;
    }

    .chat-messages {
      flex:1;
      min-height:430px;
      max-height:560px;
      overflow-y:auto;
      padding:24px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .message {
      max-width:min(72%,620px);
      padding:12px 15px;
      border:1px solid var(--border);
      line-height:1.5;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .message.mine {
      align-self:flex-end;
      border-color:rgba(74,157,168,.4);
      background:rgba(74,157,168,.07);
    }

    .message.theirs {
      align-self:flex-start;
    }

    .message-time {
      margin-top:7px;
      color:var(--gray);
      font-size:.58rem;
      text-transform:uppercase;
    }

    .chat-compose {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      padding:16px;
      border-top:1px solid var(--border);
    }

    .chat-compose textarea {
      width:100%;
      min-height:48px;
      max-height:130px;
      resize:vertical;
      box-sizing:border-box;
    }

    .messages-empty {
      padding:50px 24px;
      color:var(--gray-light);
      text-align:center;
    }

    .mobile-conversations-button {
      display:none;
    }

    @media(max-width:760px) {

      .messages-shell {
        width:calc(100% - 28px);
        padding-top:90px;
      }

      .messages-layout {
        display:block;
        min-height:0;
      }

      .conversation-sidebar {
        border-right:0;
        border-bottom:1px solid var(--border);
      }

      .conversation-list {
        max-height:260px;
      }

      .chat-messages {
        min-height:390px;
        max-height:55vh;
        padding:16px;
      }

      .message {
        max-width:86%;
      }

      .chat-compose {
        grid-template-columns:1fr;
      }

      .chat-compose .btn-primary {
        width:100%;
      }

    }

  </style>

</head>

<body>

<nav></nav>

<main class="messages-shell">

  <header class="messages-head">

    <span class="section-label">
      DWM Direct
    </span>

    <h1>MESSAGES.</h1>

    <p>
      Talk directly with buyers and
      independent DWM stores.
    </p>

  </header>


  <section class="messages-layout">

    <aside class="conversation-sidebar">

      <div class="conversation-sidebar-head">

        <div class="dwm-direct-sidebar-top">

          <span class="dwm-direct-sidebar-title">
            Conversations
          </span>

          <button
            id="newChatButton"
            class="new-chat-button"
            type="button"
            aria-label="Start a new chat"
            title="Start a new chat"
          >
            ✎
          </button>

        </div>

      </div>

      <div class="conversation-search-wrap">

        <input
          id="conversationSearch"
          class="conversation-search"
          type="search"
          placeholder="Search conversations..."
          autocomplete="off"
        >

      </div>

      <div
        id="conversationList"
        class="conversation-list"
      >
        <div class="messages-empty">
          Loading conversations...
        </div>
      </div>

    </aside>


    <section class="chat-panel">

      <div
        id="chatHead"
        class="chat-head"
      >
        <div>
          <div class="chat-head-title">
            DWM Messages
          </div>

          <div class="chat-head-context">
            Select a conversation.
          </div>
        </div>
      </div>


      <div
        id="chatMessages"
        class="chat-messages"
      >
        <div class="messages-empty">
          Select a conversation to begin.
        </div>
      </div>


      <form
        id="messageForm"
        class="chat-compose"
        style="display:none;"
      >

        <textarea
          id="messageInput"
          class="form-input"
          maxlength="2000"
          placeholder="Write a message..."
          required
        ></textarea>

        

        <button
          id="sendMessageButton"
          type="submit"
          class="btn-primary"
        >
          Send
        </button>

      </form>

    </section>

  </section>

</main>

<script
  type="module"
  src="/assets/js/messages-page.js"
></script>


<div
  id="startChatOverlay"
  class="start-chat-overlay"
  aria-hidden="true"
>

  <div
    class="start-chat-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="startChatTitle"
  >

    <div class="start-chat-head">

      <strong id="startChatTitle">
        START A CHAT
      </strong>

      <button
        id="startChatClose"
        class="start-chat-close"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

    </div>

    <div class="start-chat-body">

      <input
        id="startChatInput"
        class="start-chat-input"
        type="search"
        placeholder="Search people or DWM stores..."
        autocomplete="off"
      >

      <div
        id="startChatResults"
        class="start-chat-results"
      >
        <div class="start-chat-empty">
          Search DWM to start a conversation.
        </div>
      </div>

    </div>

  </div>

</div>

</body>

</html>
