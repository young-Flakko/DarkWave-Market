<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DWM — Order Created</title>

  <meta
    name="description"
    content="Your Dark Wave Market order has been created."
  >

  <link
    rel="icon"
    type="image/png"
    href="/assets/img/dwm-logo-new.png"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

    <link rel="stylesheet" href="/assets/css/shared.css">
  <link rel="stylesheet" href="/assets/css/pages.css">

  <style>
    :root {
      --black: #050505;
      --charcoal: #101010;

      --teal: #4a9da8;
      --teal-bright: #5bbfcc;
      --teal-dim: #2a6d78;

      --white: #e8e8e8;

      --steel: #8a9ba8;

      --gray: #555;
      --gray-light: #888;

      --danger: #cf5858;

      --border: rgba(74, 157, 168, 0.18);
      --border-strong: rgba(74, 157, 168, 0.38);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(74, 157, 168, 0.1),
          transparent 35%
        ),
        #050505;

      color: var(--white);

      font-family:
        'Rajdhani',
        sans-serif;
    }

    body::before {
      content: '';

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.025;

      z-index: 9998;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    }

    a,
    button {
      font: inherit;
    }

    #nav {
      position: relative;
      z-index: 100;
    }

    .hero {
      padding:
        clamp(70px, 9vw, 120px)
        24px
        56px;

      border-bottom:
        1px solid
        var(--border);

      text-align: center;
    }

    .hero-inner {
      width:
        min(
          1100px,
          100%
        );

      margin: 0 auto;
    }

    .success-mark {
      width: 72px;
      height: 72px;

      margin:
        0 auto
        26px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(91, 191, 204, 0.48);

      background:
        rgba(74, 157, 168, 0.07);

      color:
        var(--teal-bright);

      font-family:
        'Cinzel',
        serif;

      font-size: 1.8rem;

      transform:
        rotate(45deg);
    }

    .success-mark span {
      transform:
        rotate(-45deg);
    }

    .eyebrow {
      color: var(--teal);

      font-size: 0.61rem;
      font-weight: 700;

      letter-spacing: 0.48em;

      text-transform: uppercase;

      margin-bottom: 16px;
    }

    .hero-title {
      font-family:
        'Cinzel Decorative',
        serif;

      font-size:
        clamp(
          2.5rem,
          7vw,
          5.5rem
        );

      line-height: 0.98;

      font-weight: 900;

      background:
        linear-gradient(
          145deg,
          #2a6d78,
          #4a9da8 30%,
          #7dd4e0 50%,
          #4a9da8 70%,
          #2a5a63
        );

      -webkit-background-clip:
        text;

      -webkit-text-fill-color:
        transparent;

      background-clip:
        text;
    }

    .hero-copy {
      max-width: 620px;

      margin:
        22px auto
        0;

      color:
        var(--gray-light);

      font-family:
        'Cinzel',
        serif;

      font-size: 0.86rem;

      line-height: 1.8;

      letter-spacing: 0.05em;
    }

    .page {
      width:
        min(
          1100px,
          calc(100% - 40px)
        );

      margin: 0 auto;

      padding:
        42px 0
        100px;
    }

    .loading,
    .error {
      min-height: 280px;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      border:
        1px dashed
        var(--border);

      color:
        var(--gray-light);

      padding: 40px;
    }

    .error h2 {
      font-family:
        'Cinzel',
        serif;

      color:
        var(--white);

      margin-bottom: 12px;
    }

    .order-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1.35fr)
        minmax(290px, 0.65fr);

      gap: 24px;

      align-items: start;
    }

    .panel {
      border:
        1px solid
        var(--border);

      background:
        rgba(255, 255, 255, 0.015);
    }

    .panel-head {
      padding: 20px 22px;

      border-bottom:
        1px solid
        var(--border);
    }

    .panel-label {
      color:
        var(--teal-dim);

      font-size: 0.54rem;
      font-weight: 700;

      letter-spacing: 0.28em;

      text-transform: uppercase;

      margin-bottom: 6px;
    }

    .panel-title {
      font-family:
        'Cinzel',
        serif;

      font-size: 1rem;
      font-weight: 700;
    }

    .panel-body {
      padding: 22px;
    }

    .order-reference {
      margin-bottom: 24px;

      padding: 18px;

      border:
        1px solid
        rgba(74, 157, 168, 0.22);

      background:
        rgba(74, 157, 168, 0.04);
    }

    .reference-label {
      color:
        var(--teal-dim);

      font-size: 0.54rem;
      font-weight: 700;

      letter-spacing: 0.26em;

      text-transform: uppercase;

      margin-bottom: 7px;
    }

    .reference-value {
      font-family:
        'Cinzel',
        serif;

      color:
        var(--teal-bright);

      font-size:
        clamp(
          0.95rem,
          2vw,
          1.25rem
        );

      font-weight: 700;

      letter-spacing: 0.06em;

      word-break:
        break-word;
    }

    .items {
      display: grid;

      gap: 14px;
    }

    .item {
      display: grid;

      grid-template-columns:
        86px
        minmax(0, 1fr);

      gap: 14px;

      padding-bottom: 14px;

      border-bottom:
        1px solid
        rgba(74, 157, 168, 0.1);
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-image {
      width: 86px;
      height: 86px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;

      border:
        1px solid
        rgba(74, 157, 168, 0.14);

      overflow: hidden;
    }

    .item-image img {
      width: 100%;
      height: 100%;

      padding: 8px;

      display: block;

      object-fit: contain;
    }

    .item-name {
      font-family:
        'Cinzel',
        serif;

      font-size: 0.79rem;
      font-weight: 700;

      line-height: 1.45;
    }

    .item-store {
      margin-top: 5px;

      color:
        var(--teal-dim);

      font-size: 0.58rem;
      font-weight: 700;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    .item-meta {
      margin-top: 8px;

      color:
        var(--gray-light);

      font-size: 0.68rem;

      line-height: 1.55;
    }

    .item-total {
      margin-top: 7px;

      color:
        var(--teal-bright);

      font-weight: 700;
    }

    .status-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 10px;

      margin-bottom: 22px;
    }

    .status-box {
      padding: 14px;

      border:
        1px solid
        var(--border);

      background:
        rgba(255, 255, 255, 0.01);
    }

    .status-label {
      margin-bottom: 7px;

      color:
        var(--gray);

      font-size: 0.52rem;
      font-weight: 700;

      letter-spacing: 0.22em;

      text-transform: uppercase;
    }

    .status-value {
      color:
        var(--white);

      font-size: 0.68rem;
      font-weight: 800;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    .status-pending {
      color:
        #d7b76e;
    }

    .status-paid,
    .status-delivered {
      color:
        var(--teal-bright);
    }

    .status-failed,
    .status-cancelled {
      color:
        #ff9898;
    }

    .details {
      display: grid;

      gap: 16px;
    }

    .detail-group {
      padding-top: 16px;

      border-top:
        1px solid
        rgba(74, 157, 168, 0.1);
    }

    .detail-group:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .detail-title {
      color:
        var(--teal-dim);

      font-size: 0.54rem;
      font-weight: 700;

      letter-spacing: 0.24em;

      text-transform: uppercase;

      margin-bottom: 7px;
    }

    .detail-copy {
      color:
        var(--gray-light);

      font-size: 0.72rem;

      line-height: 1.7;
    }

    .totals {
      margin-top: 22px;

      border-top:
        1px solid
        var(--border);

      padding-top: 18px;
    }

    .row {
      display: flex;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 10px;

      color:
        var(--gray-light);

      font-size: 0.72rem;
    }

    .row strong {
      color:
        var(--white);
    }

    .row.final {
      margin-top: 16px;

      padding-top: 16px;

      border-top:
        1px solid
        rgba(74, 157, 168, 0.14);

      font-family:
        'Cinzel',
        serif;

      color:
        var(--white);

      font-size: 0.84rem;
    }

    .row.final strong {
      color:
        var(--teal-bright);

      font-size: 1rem;
    }

    .actions {
      display: grid;

      gap: 10px;

      margin-top: 24px;
    }

    .action {
      min-height: 48px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-decoration: none;

      border:
        1px solid
        var(--border);

      color:
        var(--steel);

      font-size: 0.62rem;
      font-weight: 800;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      transition:
        border-color 0.2s,
        color 0.2s,
        background 0.2s;
    }

    .action:hover {
      border-color:
        var(--teal);

      color:
        var(--teal-bright);

      background:
        rgba(74, 157, 168, 0.04);
    }

    .action.primary {
      background:
        var(--teal);

      border-color:
        var(--teal);

      color:
        var(--black);
    }

    .action.primary:hover {
      background:
        var(--teal-bright);

      color:
        var(--black);
    }

    .payment-warning {
      margin-top: 22px;

      padding: 14px;

      border:
        1px solid
        rgba(215, 183, 110, 0.25);

      background:
        rgba(215, 183, 110, 0.04);

      color:
        #bca979;

      font-size: 0.65rem;

      line-height: 1.6;
    }

    @media (
      max-width: 800px
    ) {

      .order-layout {
        grid-template-columns:
          1fr;
      }

    }

    @media (
      max-width: 520px
    ) {

      .page {
        width:
          calc(
            100% - 24px
          );
      }

      .hero {
        padding-left: 16px;
        padding-right: 16px;
      }

      .status-grid {
        grid-template-columns:
          1fr;
      }

      .item {
        grid-template-columns:
          72px
          minmax(0, 1fr);
      }

      .item-image {
        width: 72px;
        height: 72px;
      }

    }
  </style>
</head>

<body>

  <nav></nav>

  <div id="nav"></div>

  <header class="hero">

    <div class="hero-inner">

      <div class="success-mark">
        <span>✓</span>
      </div>

      <div class="eyebrow">
        ◆ Dark Wave Market / Order Created
      </div>

      <h1 class="hero-title">
        ORDER<br>RECEIVED
      </h1>

      <p class="hero-copy">
        Your order has entered the Dark Wave Market.
        Payment has not been taken yet.
      </p>

    </div>

  </header>

  <main class="page">

    <div
      id="orderRoot"
      class="loading"
    >
      Retrieving your order...
    </div>

  </main>

  <script
    type="module"
    src="/assets/js/order-success.js"
  ></script>

</body>
</html>
