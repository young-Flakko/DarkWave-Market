<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DWM — Manage Home</title>

<link rel="stylesheet" href="/assets/css/shared.css">
<link rel="stylesheet" href="/assets/css/pages.css">

<style>
.home-admin{
  width:min(1200px,92%);
  margin:120px auto 80px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:32px;
}

.eyebrow{
  color:var(--teal-bright);
  text-transform:uppercase;
  letter-spacing:.25em;
  font-size:.65rem;
  font-weight:800;
}

.title{
  font-size:clamp(2.8rem,6vw,5rem);
  margin:6px 0;
}

.sub{
  color:var(--gray-light);
}

.panel{
  background:#111;
  border:1px solid rgba(255,255,255,.1);
  padding:24px;
  border-radius:16px;
  margin-bottom:18px;
}

.panel h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  margin-bottom:16px;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:.65rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--gray-light);
}

input,
select{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:#181818;
  color:#fff;
}

.btn{
  border:1px solid rgba(255,255,255,.13);
  background:#151515;
  color:#fff;
  padding:13px 20px;
  border-radius:10px;
  text-decoration:none;
  cursor:pointer;
  font-weight:700;
}

.btn.primary{
  background:var(--teal-bright);
  color:#07110f;
  border-color:transparent;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

#status{
  margin-top:12px;
}

[data-theme="light"] .panel,
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] .btn{
  background:#fff;
  color:#111;
  border-color:rgba(0,0,0,.12);
}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .head{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<nav></nav>

<main class="home-admin">

  <div class="head">
    <div>
      <div class="eyebrow">Administration</div>
      <h1 class="title">Home Page.</h1>
      <p class="sub">
        Control homepage merchandising without redeploying DWM.
      </p>
    </div>

    <a href="/admin.html" class="btn">← Admin</a>
  </div>

  <form id="homeForm">

    <section class="panel">

      <h2>Fresh From The Market</h2>

      <div class="grid">

        <div class="field">
          <label>Section Label</label>
          <input
            id="sectionLabel"
            maxlength="40"
            value="Latest"
          >
        </div>

        <div class="field">
          <label>Section Heading</label>
          <input
            id="sectionTitle"
            maxlength="100"
            value="Fresh from the market."
          >
        </div>

      </div>

    </section>

    <section class="panel">

      <h2>Featured Products</h2>

      <p class="sub">
        Only live marketplace products can be selected.
      </p>

      <div class="grid">

        <div class="field full">
          <label>Featured Product</label>
          <select id="slot0"></select>
        </div>

        <div class="field">
          <label>Slot 01</label>
          <select id="slot1"></select>
        </div>

        <div class="field">
          <label>Slot 02</label>
          <select id="slot2"></select>
        </div>

        <div class="field">
          <label>Slot 03</label>
          <select id="slot3"></select>
        </div>

        <div class="field">
          <label>Slot 04</label>
          <select id="slot4"></select>
        </div>

      </div>

    </section>

    <div class="actions">

      <a
        href="/index.html"
        target="_blank"
        class="btn"
      >
        Preview Home
      </a>

      <button
        id="saveHome"
        type="submit"
        class="btn primary"
      >
        Save Home Page
      </button>

    </div>

    <div id="status"></div>

  </form>

</main>

<script type="module" src="/assets/js/admin-home.js"></script>

</body>
</html>
